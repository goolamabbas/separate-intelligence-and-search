<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc"><title id="title">A focused research workflow</title><desc id="desc">Six steps from setting provider boundaries to delivering a sourced answer. Verification can reuse sufficient returned source content, and reporting is proportional to the task.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#4B5965"/></marker></defs><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="990" rx="24" fill="#FBFAF7" stroke="none" stroke-width="2"/><text x="48" y="64" font-size="36" fill="#17324D" font-weight="600"><tspan x="48" dy="0">A focused research workflow</tspan></text><text x="48" y="105" font-size="23" fill="#4B5965" font-weight="400"><tspan x="48" dy="0">Choose tools for the evidence you need.</tspan></text><rect x="48" y="140" width="1104" height="104" rx="18" fill="#EFF8F7" stroke="#247B7B" stroke-width="2"/><circle cx="88" cy="179" r="22" fill="#247B7B"/><text x="88" y="187" text-anchor="middle" font-size="23" font-weight="600" fill="white">1</text><text x="128" y="172" font-size="24" fill="#17324D" font-weight="600"><tspan x="128" dy="0">Set the boundaries</tspan></text><text x="128" y="202" font-size="21" fill="#4B5965" font-weight="400"><tspan x="128" dy="0">Native only, restricted providers, or flexible routing.</tspan><tspan x="128" dy="27">Apply any restrictions on provider-generated analysis.</tspan></text><path d="M 600 245 L 600 261" fill="none" stroke="#4B5965" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="264" width="1104" height="104" rx="18" fill="#FFFFFF" stroke="#BAC4CB" stroke-width="2"/><circle cx="88" cy="303" r="22" fill="#536B7A"/><text x="88" y="311" text-anchor="middle" font-size="23" font-weight="600" fill="white">2</text><text x="128" y="296" font-size="24" fill="#17324D" font-weight="600"><tspan x="128" dy="0">Define the evidence</tspan></text><text x="128" y="326" font-size="21" fill="#4B5965" font-weight="400"><tspan x="128" dy="0">Identify the sources, fields, and dates needed</tspan><tspan x="128" dy="27">to answer the question.</tspan></text><path d="M 600 369 L 600 385" fill="none" stroke="#4B5965" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="388" width="1104" height="104" rx="18" fill="#FFFFFF" stroke="#BAC4CB" stroke-width="2"/><circle cx="88" cy="427" r="22" fill="#536B7A"/><text x="88" y="435" text-anchor="middle" font-size="23" font-weight="600" fill="white">3</text><text x="128" y="420" font-size="24" fill="#17324D" font-weight="600"><tspan x="128" dy="0">Choose the tools</tspan></text><text x="128" y="450" font-size="21" fill="#4B5965" font-weight="400"><tspan x="128" dy="0">Use the smallest available set that covers the task.</tspan><tspan x="128" dy="27">Give each provider a distinct role.</tspan></text><path d="M 600 493 L 600 509" fill="none" stroke="#4B5965" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="512" width="1104" height="104" rx="18" fill="#FFFFFF" stroke="#BAC4CB" stroke-width="2"/><circle cx="88" cy="551" r="22" fill="#536B7A"/><text x="88" y="559" text-anchor="middle" font-size="23" font-weight="600" fill="white">4</text><text x="128" y="544" font-size="24" fill="#17324D" font-weight="600"><tspan x="128" dy="0">Retrieve or request analysis</tspan></text><text x="128" y="574" font-size="21" fill="#4B5965" font-weight="400"><tspan x="128" dy="0">Select the operation and output options deliberately.</tspan><tspan x="128" dy="27">Avoid duplicate searches, page reads, and active jobs.</tspan></text><path d="M 600 617 L 600 633" fill="none" stroke="#4B5965" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="636" width="1104" height="104" rx="18" fill="#FCF4E9" stroke="#B36B22" stroke-width="2"/><circle cx="88" cy="675" r="22" fill="#B36B22"/><text x="88" y="683" text-anchor="middle" font-size="23" font-weight="600" fill="white">5</text><text x="128" y="668" font-size="24" fill="#17324D" font-weight="600"><tspan x="128" dy="0">Inspect and verify evidence</tspan></text><text x="128" y="698" font-size="21" fill="#4B5965" font-weight="400"><tspan x="128" dy="0">Check source context and freshness where needed.</tspan><tspan x="128" dy="27">Reuse sufficient source content already returned.</tspan></text><path d="M 600 741 L 600 757" fill="none" stroke="#4B5965" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="760" width="1104" height="104" rx="18" fill="#FFFFFF" stroke="#BAC4CB" stroke-width="2"/><circle cx="88" cy="799" r="22" fill="#536B7A"/><text x="88" y="807" text-anchor="middle" font-size="23" font-weight="600" fill="white">6</text><text x="128" y="792" font-size="24" fill="#17324D" font-weight="600"><tspan x="128" dy="0">Report what matters</tspan></text><text x="128" y="822" font-size="21" fill="#4B5965" font-weight="400"><tspan x="128" dy="0">Cite evidence, distinguish facts from inference,</tspan><tspan x="128" dy="27">and disclose contributions and material limitations.</tspan></text><rect x="48" y="903" width="1104" height="58" rx="18" fill="#E8EFF2" stroke="none" stroke-width="2"/><text x="76" y="940" font-size="23" fill="#17324D" font-weight="500"><tspan x="76" dy="0">Result: a sourced answer with clear contributions and limitations.</tspan></text></g></svg>