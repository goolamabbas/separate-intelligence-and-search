<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="866" viewBox="0 0 1200 866" role="img" aria-labelledby="title desc"><title id="title">Source processing and answer generation</title><desc id="desc">Two paths distinguish model-assisted source preparation from provider-generated analysis. Both lead to evidence checking and a final answer by the selected model.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#4B5965"/></marker></defs><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="866" rx="24" fill="#FBFAF7" stroke="none" stroke-width="2"/><text x="48" y="62" font-size="35" fill="#17324D" font-weight="600"><tspan x="48" dy="0">Source processing and answer generation</tspan></text><text x="48" y="103" font-size="22" fill="#4B5965" font-weight="400"><tspan x="48" dy="0">The selected operation and output options determine the workflow.</tspan></text><rect x="32" y="140" width="1136" height="278" rx="18" fill="#EFF8F7" stroke="none" stroke-width="2"/><text x="52" y="177" font-size="26" fill="#17324D" font-weight="600"><tspan x="52" dy="0">A. Source retrieval and preparation</tspan></text><text x="52" y="212" font-size="21" fill="#4B5965" font-weight="400"><tspan x="52" dy="0">Provider-side models may help prepare evidence.</tspan></text><rect x="52" y="237" width="348" height="156" rx="14" fill="#FFFFFF" stroke="#247B7B" stroke-width="2"/><text x="70" y="271" font-size="22" fill="#17324D" font-weight="600"><tspan x="70" dy="0">Provider prepares sources</tspan></text><text x="70" y="307" font-size="20" fill="#4B5965" font-weight="400"><tspan x="70" dy="0">Finds and ranks results;</tspan><tspan x="70" dy="28">selects relevant passages</tspan><tspan x="70" dy="28">or extracts source content.</tspan></text><path d="M 402 316 L 423 316" fill="none" stroke="#4B5965" stroke-width="3" marker-end="url(#arrow)"/><rect x="426" y="237" width="348" height="156" rx="14" fill="#FFFFFF" stroke="#247B7B" stroke-width="2"/><text x="444" y="271" font-size="22" fill="#17324D" font-weight="600"><tspan x="444" dy="0">Selected model analyzes</tspan></text><text x="444" y="307" font-size="20" fill="#4B5965" font-weight="400"><tspan x="444" dy="0">Checks evidence and context;</tspan><tspan x="444" dy="28">develops the answer from</tspan><tspan x="444" dy="28">the returned source material.</tspan></text><path d="M 776 316 L 797 316" fill="none" stroke="#4B5965" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="237" width="348" height="156" rx="14" fill="#FFFFFF" stroke="#247B7B" stroke-width="2"/><text x="818" y="271" font-size="22" fill="#17324D" font-weight="600"><tspan x="818" dy="0">Selected model answers</tspan></text><text x="818" y="307" font-size="20" fill="#4B5965" font-weight="400"><tspan x="818" dy="0">Presents a sourced answer</tspan><tspan x="818" dy="28">and identifies material</tspan><tspan x="818" dy="28">limitations.</tspan></text><rect x="32" y="442" width="1136" height="278" rx="18" fill="#FCF4E9" stroke="none" stroke-width="2"/><text x="52" y="479" font-size="26" fill="#17324D" font-weight="600"><tspan x="52" dy="0">B. Provider-generated analysis</tspan></text><text x="52" y="514" font-size="21" fill="#4B5965" font-weight="400"><tspan x="52" dy="0">The provider contributes generated analysis as well as evidence.</tspan></text><rect x="52" y="539" width="348" height="156" rx="14" fill="#FFFFFF" stroke="#B36B22" stroke-width="2"/><text x="70" y="573" font-size="22" fill="#17324D" font-weight="600"><tspan x="70" dy="0">Provider generates analysis</tspan></text><text x="70" y="609" font-size="20" fill="#4B5965" font-weight="400"><tspan x="70" dy="0">Produces an answer, report,</tspan><tspan x="70" dy="28">comparison, or inferred</tspan><tspan x="70" dy="28">findings.</tspan></text><path d="M 402 618 L 423 618" fill="none" stroke="#4B5965" stroke-width="3" marker-end="url(#arrow)"/><rect x="426" y="539" width="348" height="156" rx="14" fill="#FFFFFF" stroke="#B36B22" stroke-width="2"/><text x="444" y="573" font-size="22" fill="#17324D" font-weight="600"><tspan x="444" dy="0">Selected model verifies</tspan></text><text x="444" y="609" font-size="20" fill="#4B5965" font-weight="400"><tspan x="444" dy="0">Checks underlying sources;</tspan><tspan x="444" dy="28">separates retrieved facts</tspan><tspan x="444" dy="28">from generated conclusions.</tspan></text><path d="M 776 618 L 797 618" fill="none" stroke="#4B5965" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="539" width="348" height="156" rx="14" fill="#FFFFFF" stroke="#B36B22" stroke-width="2"/><text x="818" y="573" font-size="22" fill="#17324D" font-weight="600"><tspan x="818" dy="0">Selected model answers</tspan></text><text x="818" y="609" font-size="20" fill="#4B5965" font-weight="400"><tspan x="818" dy="0">Incorporates verified findings;</tspan><tspan x="818" dy="28">discloses provider contributions</tspan><tspan x="818" dy="28">and material limitations.</tspan></text><text x="48" y="764" font-size="23" fill="#17324D" font-weight="600"><tspan x="48" dy="0">Retrieval does not mean model-free processing.</tspan></text><text x="48" y="799" font-size="21" fill="#4B5965" font-weight="400"><tspan x="48" dy="0">Ranking and passage selection differ from generating an answer or analysis.</tspan><tspan x="48" dy="30">A search or fetch tool can offer either kind of output—check its options.</tspan></text></g></svg>